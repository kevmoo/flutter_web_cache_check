name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed bin lib test
        if: always() && steps.install.outcome == 'success'
      - name: Analyze code
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'

  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        sdk: ['3.13', dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - run: dart test -p vm
        if: always() && steps.install.outcome == 'success'

  redteam_harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/redteam_harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: dev
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - id: install
        name: Install harness dependencies
        run: dart pub get
      - name: Check harness formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
      - name: Analyze harness
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'
      - name: Run harness unit & dogfood tests
        run: dart test
        if: always() && steps.install.outcome == 'success'

  wasm_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install root and harness dependencies
        run: |
          dart pub get
          dart pub get -C tool/redteam_harness
      - name: Build sample_app with --wasm --web-content-hash
        working-directory: tool/sample_app
        run: |
          flutter pub get
          flutter build web --wasm --web-content-hash
      - name: Run redteam_harness S15 dogfood (JS + WASM, sim & firebase-emulator)
        run: |
          REDTEAM_FLUTTER_MASTER="$(dirname "$(dirname "$(which flutter)")")" \
            dart tool/redteam_harness/bin/redteam.dart --only S15 --backend sim --out /tmp/redteam_s15_sim_ci
          REDTEAM_FLUTTER_MASTER="$(dirname "$(dirname "$(which flutter)")")" \
            dart tool/redteam_harness/bin/redteam.dart --only S15 --backend firebase-emulator --out /tmp/redteam_s15_emul_ci
